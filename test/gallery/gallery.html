<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signal component gallery</title>
<link rel="stylesheet" href="/signal.css"><link rel="stylesheet" href="/heat.css">
<style>
  body{padding:0}
  .gal-h{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
    padding:12px var(--gut);display:flex;gap:12px;align-items:center;
    font:600 var(--t-2)/1 var(--mono);letter-spacing:var(--ls-widest);text-transform:uppercase;color:var(--dim)}
  .gal-w{max-width:900px;margin:0 auto;padding:24px var(--gut) 80px}
  .gal-l{font:600 var(--t-2)/1 var(--mono);letter-spacing:var(--ls-widest);
    text-transform:uppercase;color:var(--dim);margin:32px 0 12px}
</style></head><body>
<div class="gal-h"><span>Component gallery</span><span id="th"></span></div>
<main id="main" class="gal-w"></main>
<script>
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const price = v => v==null?'\u2014':'\u20b9'+Number(v).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const pct = v => { const n=Number(v); if(!isFinite(n)) return '\u2014';
    const r=Number(n.toFixed(2)); return (r>0?'+':'')+(r===0?'0.00':r.toFixed(2))+'%'; };
  const dir = v => Number(v)>0?'up':Number(v)<0?'dn':'';
  const ppFmt = v => (Number(v)>0?'+':'')+Number(v).toFixed(2)+' pp';
  const strengthWord = s => s>=85?'Strong':s>=70?'Firm':s>=50?'Mixed':'Weak';
  const instiOf = sym => ({quality:'complete', signal:'accumulation', fii_pp:0.79, dii_pp:12.04});
  const VERDICT_LOOK = { BUY:['up','Buy'], WAIT:['wn','Wait for entry'], AVOID:['dn','Avoid'] };
</script>
<script src="/.gallery/parts.js"></script>
