# ─────────────────────────────────────────────────────────────────────────────
# sync-data.yml — pull the feed files from the newspaper repo into this one.
#
# THIS IS THE FILE THAT DECOUPLES THE TWO PROJECTS.
#
# Moving the site to its own repo and its own Worker isolates the DEPLOY: a
# broken build over there can no longer take this site down, and a thirteenth
# serverless function can no longer break it silently. It does nothing for the
# DATA, because most of the feeds this site reads are build artefacts produced
# by generate.py and scan_research.py in trading-dashboard.
#
# The options were: recompute them here (two sources of truth for the same
# numbers — the worst outcome), fetch them from news.askakshay.com at request
# time (that site going down takes this one with it, which is the coupling we
# are removing), or mirror them. This mirrors them.
#
# The consequence, stated plainly: if the newspaper build fails, this site
# keeps serving the LAST GOOD copy of every feed rather than failing with it.
# Stale is a state this page already handles and labels; gone is not.
#
# The API routes are unaffected — they read Turso and Yahoo directly and are
# live regardless of what either repo's build is doing.
# ─────────────────────────────────────────────────────────────────────────────
name: sync data

on:
  schedule:
    # THE FIRST SYNC USED TO BE 06:40 UTC AND THE MORNING WAS THE HOLE.
    #
    # The comment this replaces said "the newspaper builds at ~05:30 UTC".
    # It does not. Its cron is `0 22 * * *` and, with drift, it lands between
    # 22:00 and 01:00 UTC — observed 23:44Z on 1 Sep and 00:57Z the day before.
    #
    # So today's edition was finished at 07:46 MYT and the site went on serving
    # yesterday's until the 06:40 UTC sync at 14:40 MYT. Nearly seven hours,
    # covering the whole Malaysian morning — the window in which the brief goes
    # out and the site is actually read. The feeds were not stale because
    # anything failed; they were stale because nothing was scheduled to collect
    # them until the afternoon.
    #
    # 01:30 UTC (09:30 MYT) sits after the latest observed build finish. The
    # later two remain as backstops for a build that ran very late or was
    # re-run by hand.
    - cron: "30 1 * * *"
    - cron: "40 6 * * *"
    - cron: "40 12 * * *"
  workflow_dispatch:
  push:
    # ON MAIN ONLY. The branch filter was missing and the trigger fires on a
    # PATH, so editing this file on a feature branch started a real sync: it
    # fetched all fourteen feeds, reset the worktree to origin/main, and then
    # tried `git push origin main` from a checkout whose only local branch is
    # the feature one. "src refspec main does not match any", three times, then
    # red — every time this file is touched anywhere but main.
    #
    # It cannot succeed off main and must not: the feeds belong on main, and a
    # branch running this would race the scheduled sync for the same push.
    branches: [main]
    paths: [".github/workflows/sync-data.yml"]

permissions:
  contents: write

concurrency:
  group: sync-data
  cancel-in-progress: false

env:
  UPSTREAM: caakshayk1-boop/trading-dashboard

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetched from the upstream repo, not from news.askakshay.com. The repo
      # is the source of truth and is reachable even when the site is not.
      # A public repo needs no token; GITHUB_TOKEN is passed anyway so this
      # keeps working if the upstream is ever made private.
      # THE FRONTEND IS NO LONGER MIRRORED — THIS REPO OWNS IT.
      #
      # There was a step here that pulled static/next.{js,css} from the
      # newspaper repo twice a day. It existed because the two copies had
      # drifted and both repos had passing tests, so nothing caught it.
      #
      # It is removed because the direction is now the other way round: this is
      # the site being built, news.askakshay.com is frozen, and a mirror
      # pointing inward would silently overwrite every change made here within
      # twelve hours. That is a worse failure than drift — drift is visible in
      # a diff, this would look like the edits never happened.
      #
      # The DATA still mirrors, below, because the fourteen JSON feeds are genuinely
      # build artefacts of generate.py upstream and are not authored here.
      #
      # ── AND ONE FRONTEND FILE DOES, WHICH IS NOT A REVERSAL OF THE ABOVE ──
      #
      # brief_fundamentals.js renders the Business section of the brief — the
      # composite, the four component scores, the ratio tables and the screen's
      # own risk flags. Every field in it is computed by stock_screen.py
      # upstream, so it is a build artefact of the screen in exactly the sense
      # the JSON feeds are.
      #
      # What was removed above was a mirror of signal.js and signal.css: files
      # with two authors, actively edited on BOTH sides, which had already
      # drifted while both repos stayed green. The objection was to overwriting
      # work done here. This file has one author, is never edited here, and has
      # nothing on this side to overwrite — and if it were, the alternative is
      # two copies of one section drifting, which is the fault that note is
      # about.
      #
      # It carries its own <style>, so it is one file rather than two and
      # cannot arrive half-delivered.

      - name: Fetch the data feeds
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .incoming
          fail=0
          # RESEARCH AND ALERTS_LOG WERE MISSING AND THE #research FLOOR WAS FROZEN.
          #
          # signal.js fetches /research.json and /alerts_log.json. Both files
          # exist in public/ and neither was ever synced, so they were whatever
          # somebody last committed by hand — 2026-09-08 for both, while
          # research.yml upstream rewrites them twice a day.
          #
          # That was invisible while the upstream job was itself broken: it had
          # never once completed, so there was nothing newer to miss. Fixing the
          # harvest made the scan run and go nowhere.
          FEEDS="alerts alerts_log conviction data-health edition engines funds ipo mandate news pulse research screen screen-lite swot today weekly_reads"
          # shellcheck disable=SC2086 -- word splitting is the point
          set -- $FEEDS; total=$#
          for j in $FEEDS; do
            if gh api "repos/$UPSTREAM/contents/docs/$j.json" \
                 -H "Accept: application/vnd.github.raw" > ".incoming/$j.json" 2>/dev/null \
               && [ -s ".incoming/$j.json" ]; then
              # A 404 body or an HTML error page is still a non-empty file.
              # Only valid JSON is allowed to replace a good copy.
              if python3 -c "import json,sys; json.load(open('.incoming/$j.json'))" 2>/dev/null; then
                printf '  ok    %-12s %s\n' "$j" "$(du -h ".incoming/$j.json" | cut -f1)"
              else
                printf '  BAD   %-12s not valid JSON — keeping the copy in this repo\n' "$j"
                rm -f ".incoming/$j.json"; fail=$((fail+1))
              fi
            else
              printf '  MISS  %-12s upstream did not answer — keeping the copy in this repo\n' "$j"
              rm -f ".incoming/$j.json"; fail=$((fail+1))
            fi
          done
          # Files stay in .incoming until the commit step. That step resets the
          # worktree to origin/main before copying them in, so a run that races
          # another can re-apply cleanly instead of pushing a stale parent.
          echo "failed=$fail" >> "$GITHUB_OUTPUT"
          # EVERY feed failing means the upstream moved or the token died —
          # that is worth a red run. A few missing is a partial build upstream.
          #
          # The threshold used to be the literal 10, written when the list held
          # nine names. The list has grown twice since and the number did not
          # move, so it had drifted from "all of them" to "most of them" and
          # would have gone on drifting. It is counted now.
          if [ "$fail" -ge "$total" ]; then
            echo "::error::every feed failed to fetch — check $UPSTREAM still publishes docs/*.json"
            exit 1
          fi

      # ── THE ONE SHARED FRONTEND FILE ──────────────────────────────────────
      #
      # Validated the way the feeds are, with the check that fits the format: a
      # 404 body and an HTML error page are both non-empty files, so size alone
      # proves nothing. It has to PARSE as JavaScript and it has to define the
      # thing both briefs call. A copy that parses but exports nothing would
      # load clean and leave the section rendering its "could not load" notice
      # with no error anywhere.
      #
      # A failure here keeps the copy already in this repo, exactly as a failed
      # feed does. Stale is a state the page handles; gone is not.
      - name: Fetch the shared brief section
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          f=brief_fundamentals.js
          if gh api "repos/$UPSTREAM/contents/docs/$f" \
               -H "Accept: application/vnd.github.raw" > ".incoming/$f" 2>/dev/null \
             && [ -s ".incoming/$f" ] \
             && node --check ".incoming/$f" 2>/dev/null \
             && grep -q 'BriefFundamentals' ".incoming/$f"; then
            printf '  ok    %-12s %s\n' "$f" "$(du -h ".incoming/$f" | cut -f1)"
          else
            printf '  MISS  %-12s not fetched, not valid JS, or missing its export — keeping the copy in this repo\n' "$f"
            rm -f ".incoming/$f"
          fi

      # Age is reported, never asserted, because staleness is upstream's
      # problem to fix and this job's problem to make visible.
      - name: Report feed freshness
        run: |
          python3 - <<'PY'
          import json, pathlib, datetime
          e = pathlib.Path(".incoming/edition.json")
          if e.exists():
              d = json.loads(e.read_text())
              print("edition:", d.get("build_date"), "built_at", d.get("built_at"))
          for f in sorted(pathlib.Path(".incoming").glob("*.json")):
              print(f"  {f.name:18} {f.stat().st_size/1024:8.1f} KB")
          PY

      # RESET, COPY, COMMIT, PUSH — in that order, and retried.
      #
      # The first version staged straight onto the checked-out commit and
      # pushed. Two runs overlapping (a schedule and a dispatch, seconds apart)
      # meant the second pushed a parent that no longer existed and was
      # rejected "fetch first". The data was fine; the job was red for a reason
      # that had nothing to do with the data.
      #
      # Resetting to origin/main immediately before copying makes the job
      # idempotent: it always writes what it just downloaded onto whatever the
      # remote currently is, so a loser of the race simply re-applies and wins
      # the next attempt. Nothing is ever merged, because there is nothing to
      # merge — the feeds are wholesale replacements, not edits.
      - name: Commit whatever changed
        run: |
          set -eu
          git config user.name  "signal-sync[bot]"
          git config user.email "signal-sync@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            for f in .incoming/*; do
              [ -e "$f" ] || continue
              cp "$f" "public/$(basename "$f")"
            done
            git add public/
            if git diff --cached --quiet; then
              echo "no change — upstream has not rebuilt since the last sync"
              exit 0
            fi
            git commit -q -m "sync: feeds and frontend from trading-dashboard $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            # HEAD:main, not main — the push does not depend on what the local branch
            # happens to be called. The reset above has already made HEAD equal
            # origin/main plus the feeds, so this is the same push, stated in a
            # way that cannot fail on a ref name.
            if git push origin HEAD:main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected — another run got there first; re-applying (attempt $attempt)"
            sleep $((attempt * 5))
          done
          echo "::error::could not push after 3 attempts"
          exit 1

      # ── PUBLISH ─────────────────────────────────────────────────────────────
      # Committing a feed does not put it on the internet. These files are
      # static assets uploaded by `wrangler deploy`, so until this step existed
      # the live site only changed when somebody deployed from a laptop — and
      # it then served whatever THAT laptop's public/ contained.
      #
      # The failure that produced this: on 2026-08-31 every feed on the live
      # site was 31 hours old while the upstream repo held data from an hour
      # earlier. The sync had been committing correctly the whole time. Each
      # deploy that day re-published the stale local copies over it.
      #
      # Deploys on every sync, not only when the feeds changed: the repo may
      # also carry front-end commits that nothing else publishes, and pushing
      # identical assets costs nothing.
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # THIS USED TO BE A WARNING AND `exit 0`.
          #
          # That is how the site went stale without anyone being told. The
          # token was never set, so from the day this repo was created every
          # single run took this branch: fetched the feeds correctly, committed
          # them correctly, skipped the upload, and reported SUCCESS. Thirteen
          # green runs in a row, a green history, and a live site whose data
          # had not moved since the last deploy from a laptop. On 1 Sep the
          # front page was still offering LUMINO, a book that closed on 31 Aug.
          #
          # A publishing step that cannot publish has failed. Saying so in a
          # warning nobody reads, and then claiming success, is worse than not
          # having the step: it converts a visible outage into a silent one.
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. The feeds committed above are NOT live,"
            echo "::error::and this site will keep serving whatever was last uploaded by hand."
            echo "Set it once with:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN  --repo caakshayk1-boop/signal"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID --repo caakshayk1-boop/signal"
            exit 1
          fi
          # NOT --omit=dev. wrangler IS a devDependency, so omitting dev left
          # nothing to run and `npx` silently fetched whatever version of
          # wrangler was newest that morning — an unpinned deploy tool on the
          # one job that publishes the site.
          npm ci
          # RE-RENDER BEFORE STAMPING. index.html carries a server-rendered
          # snapshot of today.json baked in at deploy time, and this step used
          # to upload fresh feeds under a snapshot built from the previous
          # ones: the JSON said Monday, the HTML a crawler saw still said
          # Sunday. Prerender reads public/*.json, which the copy above has
          # just replaced, so it has to run here and not before.
          node scripts/prerender.mjs
          # Stamp AFTER the feeds and the snapshot are in place, so the build
          # hash describes what is actually being uploaded.
          node scripts/stamp-build.mjs
          npx wrangler deploy
