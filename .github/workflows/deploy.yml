# Deploy the Worker, then check the site a browser actually renders.
#
# The check is the point. Every widget on this site is JavaScript, and a dead
# slider or a frozen number leaves a page that still looks finished — which is
# exactly how a broken deploy survives a green build. test/ui.mjs asserts the
# behaviour, not the bytes.
#
# Needs one secret: CLOUDFLARE_API_TOKEN, scoped to "Edit Cloudflare Workers".
# Without it this workflow is skipped rather than failed, so the repo is not
# permanently red before the token is set. See README.md.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "public/*.json"]   # data syncs deploy themselves below
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }

      # GUARD RAN NOWHERE.
      #
      # test/guard.mjs holds 17 static checks, every one written because the
      # fault it catches shipped, and no workflow invoked it — so it only ever
      # ran when somebody remembered to type it. It found a live fault the hour
      # it was wired in (two feeds fetched by the app and mirrored by nothing).
      #
      # It is BEFORE the token gate deliberately: the checks are static and
      # need no secret, so they must fail a push on a repo with no Cloudflare
      # token rather than being skipped behind one.
      - name: Static guards
        run: node test/guard.mjs

      # The gate was added so the repo would not be permanently red before the
      # token existed. It outlived that purpose: the token still does not
      # exist, and the gate meant every push since 29 Aug reported a
      # successful "deploy" that deployed nothing. A skipped deploy that looks
      # identical to a completed one is not a safety feature.
      - name: Require a Cloudflare token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set — this push has NOT been deployed."
            echo "  gh secret set CLOUDFLARE_API_TOKEN  --repo caakshayk1-boop/signal"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID --repo caakshayk1-boop/signal"
            exit 1
          fi

      - run: npm ci

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # SIGNAL_URL is a repo variable, not a secret — it is a public URL, and
      # putting it in vars means the log can print which site was checked.
      - if: vars.SIGNAL_URL != ''
        name: Check the rendered page
        run: |
          # DROP GOOGLE'S APT REPO FIRST.
          #
          # `--with-deps` runs `apt-get update`, and the runner image ships a
          # google-chrome source. On 2026-09-09 Google republished that repo's
          # Release file mid-fetch and apt refused the index:
          #
          #   E: Failed to fetch .../chrome-stable/deb/.../Packages.gz
          #      Hash Sum mismatch
          #   Error: Installation process exited with code: 100
          #
          # Both the newspaper build and the signal deploy died on it within a
          # minute of each other, and the retry below failed identically —
          # the mismatch lasts as long as the publisher's window, so retrying
          # inside one run cannot clear it.
          #
          # We install PLAYWRIGHT'S OWN Chromium. Nothing in this job needs
          # google-chrome, so the repo is pure third-party risk on the critical
          # path of the daily paper. Removing the source list makes apt stop
          # asking dl.google.com anything.
          # Ubuntu 24.04 runners use deb822 (.sources), not .list, so removing
          # google-chrome.list by name matched nothing and the run failed again
          # with the identical hash mismatch. Find it by CONTENT instead — that
          # is correct under either format and under any filename they pick
          # next.
          sudo bash -c 'grep -rl "dl\.google\.com" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r rm -f' || true
          npx playwright install chromium --with-deps
          node test/ui.mjs "${{ vars.SIGNAL_URL }}"
