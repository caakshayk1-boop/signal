<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vision: understand any Indian company in minutes</title>
<meta name="description" content="Price, financials, ownership, events, technical structure and market context for ~1,000 NSE companies in one research workspace. Every number carries its source and its age. Educational research, not advice.">
<!-- NOINDEX IN THE FILE, INDEX AT THE EDGE. This file is also reachable as
     signal.askakshay.com/vision, a duplicate that must not be indexed. On
     vision.askakshay.com the Worker (src/seo.js) rewrites this tag, the title,
     the description and the canonical for the home and every /company/ page. -->
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#F8F7F4">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/vision-icon.svg">
<!-- Installable: on a phone, "Add to Home Screen" opens Vision as an app with
     its own icon. The service worker (vision-sw.js) caches the shell only. -->
<link rel="manifest" href="/vision.webmanifest">
<link rel="apple-touch-icon" href="/vision-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vision">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/fonts/PlusJakarta-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/JetBrainsMono-500-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/vision.css">
<script>
/* Theme before first paint. An explicit choice wins; otherwise the system
   decides — the same rule as Signal, so moving between the two products does
   not flip the page from white to black. */
(function(){try{
  var c=localStorage.getItem('vis:theme');
  if(c!=='dark'&&c!=='light') c=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',c);
}catch(e){}
/* The server-written page (.ssr) is for readers and crawlers WITHOUT
   JavaScript. With it, the app paints in its place — showing both would
   paint the page twice and shift it (measured CLS 0.64). */
document.documentElement.classList.add('js');})();
</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="top-in">
    <!-- The parent, always one click away. Signal decides what deserves
         attention; Vision is where a name is understood. -->
    <!-- THE FAMILY LINE. Vision is Signal's company-research product, and the
         header says so the way a path does: Signal / Vision. The parent is a
         link back; the current product is the brand. -->
    <div class="fam">
      <a class="up-link" href="https://signal.askakshay.com/" aria-label="Signal, the parent product">
        <svg class="fam-mark" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" rx="5"/><path d="M4 14.5h12M10.5 5v9.5M5.5 12.5v2M15 12.5v2"/></svg><span>Signal</span></a>
      <span class="fam-sep" aria-hidden="true">/</span>
      <a class="brand" href="#/" aria-label="Vision, companies">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><rect x=".75" y=".75" width="18.5" height="18.5" rx="4.5"/><path d="M4 14.5h12M10.5 5v9.5"/></svg><span>Vision</span></a>
    </div>
    <nav class="nav" id="nav" aria-label="Primary"></nav>
    <div class="top-r">
      <span class="mkt" id="mkt" role="status" aria-live="off"></span>
      <button class="kbtn" id="kOpen" type="button" aria-label="Search symbols and pages">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="lbl">Search symbol, page…</span><span class="lbl-m">Search</span><kbd>⌘K</kbd></button>
      <a class="ibtn" href="#/alerts" id="aBtn" aria-label="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></a>
      <button class="ibtn" id="thBtn" type="button" aria-label="Switch theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</header>
<aside class="dscl" role="note"><span class="dscl-full"><b>Education only.</b>
  Not registered with SEBI as a Research Analyst or Investment Adviser. Nothing here is a recommendation to buy or sell.
  <a href="#/disclaimer">Read the disclaimer</a></span>
  <button class="dscl-m" type="button" data-dscl><b>Education only.</b> Not SEBI-registered research or advice <span aria-hidden="true">›</span></button></aside>
<div class="tick" id="tick" role="region" aria-label="Live market ticker"><div class="tick-in" id="tickIn"></div></div>

<div id="live" class="vh" role="status" aria-live="polite" aria-atomic="true"></div>
<main id="main" tabindex="-1"></main>

<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="layer"></div>
<noscript><p style="padding:24px">The live workspace needs JavaScript. Every company still has a readable page: <a href="https://vision.askakshay.com/company/RELIANCE">for example, Reliance</a>, and <a href="https://signal.askakshay.com/screen">the full screen on Signal</a>.</p></noscript>
<!-- "What matters / what changed" — the same file the Worker runs. Loaded
     first: vision.js reads window.VisionInsight when a company page paints. -->
<script src="/insight.js"></script>
<script src="/retirement.js"></script>
<script src="/v2widgets.js"></script>
<script src="/vision.js"></script>
</body>
</html>
