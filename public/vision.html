<script>
/* Theme before first paint. DARK IS THE DEFAULT here — a cockpit is read on a
   dark ground — and the key is vision's own, so choosing light on
   signal.askakshay.com does not flip this product. */
(function(){try{
  var c=localStorage.getItem('vis:theme');
  if(c!=='dark'&&c!=='light') c='dark';
  document.documentElement.setAttribute('data-theme',c);
}catch(e){}})();
</script>
